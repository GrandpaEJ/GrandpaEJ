name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          USERNAME: GrandpaEJ
          
      - name: Push to output branch
        run: |
          mv profile-3d-contrib /tmp/profile-3d-contrib
          
          git config user.name "GrandpaEJ"
          git config user.email "your-email@example.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/GrandpaEJ/GrandpaEJ.git
          
          git fetch origin output || echo "Branch output not found"
          
          if git branch -r | grep -q "origin/output"; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf .
          fi
          
          rm -rf profile-3d-contrib
          mv /tmp/profile-3d-contrib profile-3d-contrib
          
          git add profile-3d-contrib/
          git commit -m "Update 3D contribution graph with private repos" || echo "No changes to commit"
          
          git push origin output
